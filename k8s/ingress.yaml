apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mldashboard-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # NGINX rate limiting to protect against DDoS
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Enable CORS for React Frontend if needed
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  rules:
  - host: api.mldashboard.com # Replace with your real domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mldashboard-service
            port:
              number: 80
